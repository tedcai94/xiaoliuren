<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小六壬</title>
<style>
:root{--bg:#0d0f12;--card:#15181d;--line:#242a33;--gold:#c9a227;--txt:#e8e6e1;--dim:#8a8f98;--ok:#7fb069;--bad:#c05b5b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Songti SC",serif;padding:20px 16px 48px;max-width:560px}
h1{font-size:20px;letter-spacing:.35em;text-align:center;margin:6px 0 4px;color:var(--gold);font-weight:600}
.sub{text-align:center;color:var(--dim);font-size:12px;letter-spacing:.1em;margin-bottom:18px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;background:none;border:0;color:var(--dim);padding:9px 4px;font-size:13px;border-radius:9px;font-family:inherit}
.tabs button.on{background:#222831;color:var(--gold)}
label{display:block;font-size:12px;color:var(--dim);margin:12px 0 6px}
input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);padding:12px;border-radius:10px;font-size:15px;font-family:inherit}
input:focus{outline:none;border-color:#3a4250}
.row{display:flex;gap:8px}
.row input{flex:1;text-align:center}
.go{width:100%;margin-top:16px;padding:14px;border-radius:12px;border:1px solid #3a3320;background:linear-gradient(180deg,#2a2416,#1c1910);color:var(--gold);font-size:15px;letter-spacing:.2em;font-family:inherit}
.hide{display:none}
#out{margin-top:22px}
.meta{font-size:12px;color:var(--dim);line-height:1.7;margin-bottom:12px;word-break:break-all}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.card .pos{font-size:11px;color:var(--dim);letter-spacing:.15em}
.card .pal{font-size:19px;margin:6px 0 4px;letter-spacing:.1em}
.card .el{font-size:12px;color:#b9b4a8}
.card .rel{font-size:11px;color:var(--dim);margin-top:3px}
.human{border-color:#4a3f22;box-shadow:inset 0 0 0 1px #2e2717}
.luck{margin-top:14px;padding:13px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.luck b{font-size:16px;letter-spacing:.15em}
.luck.good b{color:var(--ok)}.luck.bad b{color:var(--bad)}.luck.mid b{color:var(--gold)}
.read{margin-top:14px;padding:14px 15px;border-radius:12px;background:#12151a;border:1px solid var(--line)}
.read p{margin:0 0 10px;font-size:13.5px;line-height:1.85;color:#d5d2ca}
.read p:last-child{margin-bottom:0}
.read .cmp{font-size:12.5px;color:#9aa0a8;border-top:1px solid var(--line);padding-top:10px}
.read .adv{font-size:13.5px;color:var(--gold);letter-spacing:.02em}
#yao-lines{display:flex;flex-direction:column-reverse;gap:6px;padding:16px 8px;background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:120px;justify-content:center}
.yao{display:flex;align-items:center;gap:10px;height:16px}
.yao .pos{width:22px;font-size:11px;color:#5f656e;text-align:right}
.yao .bar{flex:1;display:flex;gap:6px;align-items:center}
.yao .seg{height:10px;border-radius:2px;background:#cfccc4}
.yao.yang .seg{flex:1}
.yao.yin .seg{width:calc(50% - 3px)}
.yao.yin .gap{width:6px}
.yao.moving .seg{background:var(--gold)}
.yao .mk{width:14px;font-size:12px;color:var(--gold)}
.yao-appear{animation:yaoIn .45s ease-out}
@keyframes yaoIn{from{opacity:0;transform:translateY(-6px) scaleX(.6)}to{opacity:1;transform:none}}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:12.5px}
td,th{border-bottom:1px solid var(--line);padding:8px 4px;text-align:center;color:#cfccc4}
th{color:var(--dim);font-weight:400}
td:first-child,th:first-child{text-align:left;color:var(--dim)}
details{margin-top:14px;font-size:12px;color:var(--dim)}
summary{cursor:pointer;color:#6f7681}
.hist{margin-top:26px}
.hist h2{font-size:12px;color:var(--dim);letter-spacing:.15em;font-weight:400;margin-bottom:8px}
.hi{font-size:12.5px;color:#9aa0a8;padding:9px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.hi span:first-child{color:#cfccc4}
footer{margin-top:30px;text-align:center;font-size:11px;color:#4e535a}
</style>
</head>
<body>
<h1>小 六 壬</h1>
<div class="sub">六宫轮转 · 一时一断</div>

<div class="tabs">
  <button class="on" data-m="now">时间起卦</button>
  <button data-m="num">数字起卦</button>
  <button data-m="dir">宫位直选</button>
  <button data-m="yao">六爻摇卦</button>
</div>

<div id="f-now" class="hide"></div>

<div id="f-num" class="hide">
  <label>三个数字（随手看到、想到的都可以）</label>
  <div class="row">
    <input id="n1" type="number" inputmode="numeric" placeholder="第一">
    <input id="n2" type="number" inputmode="numeric" placeholder="第二">
    <input id="n3" type="number" inputmode="numeric" placeholder="第三">
  </div>
</div>

<div id="f-dir" class="hide">
  <label>天宫</label><input id="d1" placeholder="大安 / 留连 / 速喜 / 赤口 / 小吉 / 空亡">
  <label>地宫</label><input id="d2" placeholder="同上">
  <label>人宫</label><input id="d3" placeholder="同上">
</div>

<div id="f-yao" class="hide">
  <div id="yao-lines"></div>
  <div id="yao-info" class="meta" style="text-align:center;margin-top:10px">点下方按钮，从初爻开始，一爻一爻摇</div>
  <button class="go" id="yao-btn">摇 第 一 爻</button>
  <button class="go" id="yao-reset" style="margin-top:8px;background:none;border-color:#2a2f38;color:#8a8f98">重新摇卦</button>
</div>

<label id="qLabel">所问何事（可留空）</label>
<input id="q" placeholder="例：这笔生意能不能谈成">

<button class="go" id="go">起 课</button>

<div id="out"></div>

<div class="hist"><h2>最近起课</h2><div id="hist"></div></div>

<footer>传统术数 · 仅供参照 · 不构成任何决策依据</footer>

<script>

const PALACE_BY_VALUE={0:"空亡",1:"大安",2:"留连",3:"速喜",4:"赤口",5:"小吉"};
const PALACE_ORDER=["大安","留连","速喜","赤口","小吉","空亡"];
const ACTIVE_GODS=["青龙","朱雀","勾陈","白虎","玄武","腾蛇"];
const PALACES={
 "大安":{value:1,element:"木",luck:"大吉",dead_god:"青龙木"},
 "留连":{value:2,element:"土",luck:"中吉",dead_god:"四方土"},
 "速喜":{value:3,element:"火",luck:"吉",dead_god:"朱雀火"},
 "赤口":{value:4,element:"金",luck:"凶",dead_god:"白虎金"},
 "小吉":{value:5,element:"水",luck:"小吉",dead_god:"玄武水"},
 "空亡":{value:0,element:"土",luck:"大凶",dead_god:"勾陈土"}};
const HOURS={
 "子时":{range:"23:00-01:00",element:"水",number:1,active_start:"大安"},
 "丑时":{range:"01:00-03:00",element:"土",number:2,active_start:"留连"},
 "寅时":{range:"03:00-05:00",element:"木",number:3,active_start:"速喜"},
 "卯时":{range:"05:00-07:00",element:"木",number:4,active_start:"赤口"},
 "辰时":{range:"07:00-09:00",element:"土",number:5,active_start:"小吉"},
 "巳时":{range:"09:00-11:00",element:"火",number:6,active_start:"空亡"},
 "午时":{range:"11:00-13:00",element:"火",number:7,active_start:"大安"},
 "未时":{range:"13:00-15:00",element:"土",number:8,active_start:"留连"},
 "申时":{range:"15:00-17:00",element:"金",number:9,active_start:"速喜"},
 "酉时":{range:"17:00-19:00",element:"金",number:10,active_start:"赤口"},
 "戌时":{range:"19:00-21:00",element:"土",number:11,active_start:"小吉"},
 "亥时":{range:"21:00-23:00",element:"水",number:12,active_start:"空亡"}};
const GENERATES={木:"火",火:"土",土:"金",金:"水",水:"木"};
const CONTROLS={木:"土",土:"水",水:"火",火:"金",金:"木"};
const LUNAR_INFO=[0x04BD8,0x04AE0,0x0A570,0x054D5,0x0D260,0x0D950,0x16554,0x056A0,0x09AD0,0x055D2,0x04AE0,0x0A5B6,0x0A4D0,0x0D250,0x1D255,0x0B540,0x0D6A0,0x0ADA2,0x095B0,0x14977,0x04970,0x0A4B0,0x0B4B5,0x06A50,0x06D40,0x1AB54,0x02B60,0x09570,0x052F2,0x04970,0x06566,0x0D4A0,0x0EA50,0x06E95,0x05AD0,0x02B60,0x186E3,0x092E0,0x1C8D7,0x0C950,0x0D4A0,0x1D8A6,0x0B550,0x056A0,0x1A5B4,0x025D0,0x092D0,0x0D2B2,0x0A950,0x0B557,0x06CA0,0x0B550,0x15355,0x04DA0,0x0A5B0,0x14573,0x052B0,0x0A9A8,0x0E950,0x06AA0,0x0AEA6,0x0AB50,0x04B60,0x0AAE4,0x0A570,0x05260,0x0F263,0x0D950,0x05B57,0x056A0,0x096D0,0x04DD5,0x04AD0,0x0A4D0,0x0D4D4,0x0D250,0x0D558,0x0B540,0x0B6A0,0x195A6,0x095B0,0x049B0,0x0A974,0x0A4B0,0x0B27A,0x06A50,0x06D40,0x0AF46,0x0AB60,0x09570,0x04AF5,0x04970,0x064B0,0x074A3,0x0EA50,0x06B58,0x055C0,0x0AB60,0x096D5,0x092E0,0x0C960,0x0D954,0x0D4A0,0x0DA50,0x07552,0x056A0,0x0ABB7,0x025D0,0x092D0,0x0CAB5,0x0A950,0x0B4A0,0x0BAA4,0x0AD50,0x055D9,0x04BA0,0x0A5B0,0x15176,0x052B0,0x0A930,0x07954,0x06AA0,0x0AD50,0x05B52,0x04B60,0x0A6E6,0x0A4E0,0x0D260,0x0EA65,0x0D530,0x05AA0,0x076A3,0x096D0,0x04BD7,0x04AD0,0x0A4D0,0x1D0B6,0x0D250,0x0D520,0x0DD45,0x0B5A0,0x056D0,0x055B2,0x049B0,0x0A577,0x0A4B0,0x0AA50,0x1B255,0x06D20,0x0ADA0];

function leapMonth(y){return LUNAR_INFO[y-1900]&0xF}
function leapDays(y){return leapMonth(y)?((LUNAR_INFO[y-1900]&0x10000)?30:29):0}
function monthDays(y,m){return (LUNAR_INFO[y-1900]&(0x10000>>m))?30:29}
function lunarYearDays(y){let t=348,mask=0x8000;while(mask>0x8){if(LUNAR_INFO[y-1900]&mask)t++;mask>>=1}return t+leapDays(y)}
function solarToLunar(d){
 var base=Date.UTC(1900,0,31);
 var offset=Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-base)/86400000);
 if(offset<0) throw new Error("日期超出可换算范围");
 var y=1900;
 while(y<2050){var days=lunarYearDays(y);if(offset<days)break;offset-=days;y++}
 var leap=leapMonth(y),isLeap=false,m=1;
 while(m<=12){
   var dm=isLeap?leapDays(y):monthDays(y,m);
   if(offset<dm) return {year:y,month:m,day:offset+1,isLeap:isLeap};
   offset-=dm;
   if(leap===m&&!isLeap){isLeap=true}else{if(isLeap)isLeap=false;m++}
 }
 throw new Error("换算失败");
}
function hourNameFor(h){var names=Object.keys(HOURS);var idx=(h===23)?0:Math.floor((h+1)/2)%12;return names[idx]}
function beijingNow(){var t=new Date();return new Date(t.getTime()+(t.getTimezoneOffset()+480)*60000)}
function palaceFromValue(v){return PALACE_BY_VALUE[((v%6)+6)%6]}
function norm(n){return n===0?10:n}
function castNumbers(a,b,c){
 var p1=norm(a),p2=norm(b),p3=norm(c);
 var hv=p1%6,ev=(hv+p2-1)%6,uv=(ev+p3-1)%6;
 return {heaven:palaceFromValue(hv),earth:palaceFromValue(ev),human:palaceFromValue(uv),
   process:a+"→"+p1+"，"+b+"→"+p2+"，"+c+"→"+p3+"｜天宫="+p1+"%6="+hv+"；地宫=("+hv+"+"+p2+"-1)%6="+ev+"；人宫=("+ev+"+"+p3+"-1)%6="+uv};
}
function relation(me,other){
 if(me===other)return "兄弟";
 if(GENERATES[other]===me)return "父母";
 if(GENERATES[me]===other)return "子孙";
 if(CONTROLS[me]===other)return "妻财";
 if(CONTROLS[other]===me)return "官鬼";
 return "—";
}
function activeGods(hour){
 var start=PALACE_ORDER.indexOf(HOURS[hour].active_start);
 var out={};
 PALACE_ORDER.forEach(function(p,i){out[p]=ACTIVE_GODS[((i-start)+6)%6]});
 return out;
}
function chart(c){
 var hd=HOURS[c.hour],act=activeGods(c.hour),he=PALACES[c.human].element;
 return {hour:c.hour,heaven:c.heaven,earth:c.earth,human:c.human,
  table:{
   五行:{天宫:PALACES[c.heaven].element,地宫:PALACES[c.earth].element,人宫:he,时辰:hd.element},
   六亲:{天宫:relation(he,PALACES[c.heaven].element),地宫:relation(he,PALACES[c.earth].element),人宫:"我",时辰:relation(he,hd.element)},
   死六神:{天宫:PALACES[c.heaven].dead_god,地宫:PALACES[c.earth].dead_god,人宫:PALACES[c.human].dead_god,时辰:"—"},
   活六神:{天宫:act[c.heaven],地宫:act[c.earth],人宫:act[c.human],时辰:"—"}},
  luck:PALACES[c.human].luck,process:c.process};
}
var INTERP={
 宫:{大安:"主静。事情能成，但慢；宜守成，不宜急进。",留连:"主缠。事情会拖，多半要等；催反而更慢。",速喜:"主快。消息与机会在近期，该动就动。",赤口:"主口。易有争执、误会、口舌；凡事宜缓议。",小吉:"主顺。小成渐起，按部就班最稳。",空亡:"主空。所问多不实，宜改期、改法，或索性放下。"},
 亲:{兄弟:"牵扯同辈与合作，成败跟人有关。",父母:"有长辈、文书或平台助力，也可能要走程序。",子孙:"事有转机，结果偏松快，付出会有出口。",妻财:"与钱、所得相关；成则得，败则耗。",官鬼:"有压力、上级或阻力介入；谨言慎行。",我:"主事在己。"},
 神:{青龙:"青龙吉神，多喜庆与贵人。",朱雀:"朱雀主口舌文书，消息快，也易起争。",勾陈:"勾陈主拖延纠葛，田土房产之事尤显。",白虎:"白虎主急变与伤损，宜避锋芒。",玄武:"玄武主暗昧欺瞒，防有人在暗处。",腾蛇:"腾蛇主虚惊反复，事情绕圈。"}
};
function elementCmp(me,other){
 if(me===other)return "比和";
 if(GENERATES[other]===me)return "生我";
 if(GENERATES[me]===other)return "我生";
 if(CONTROLS[me]===other)return "我克";
 if(CONTROLS[other]===me)return "克我";
 return "比和";
}
var CMP_TXT={生我:"有助力",我生:"耗心力",我克:"可掌控",克我:"有阻力",比和:"平顺"};
function interpret(r){
 var he=PALACES[r.human].element;
 var t=r.table;
 var lines=[];
 lines.push("人宫 "+r.human+"（"+he+"）："+INTERP.宫[r.human]);
 lines.push("天宫 "+r.heaven+"（"+t.五行.天宫+"·"+t.六亲.天宫+"）："+INTERP.亲[t.六亲.天宫]+" "+INTERP.神[t.活六神.天宫]);
 lines.push("地宫 "+r.earth+"（"+t.五行.地宫+"·"+t.六亲.地宫+"）："+INTERP.亲[t.六亲.地宫]+" "+INTERP.神[t.活六神.地宫]);
 lines.push("时辰 "+r.hour+"（"+t.五行.时辰+"·"+t.六亲.时辰+"）：时机"+CMP_TXT[elementCmp(he,t.五行.时辰)]);
 var cmp=[elementCmp(he,t.五行.天宫),elementCmp(he,t.五行.地宫),elementCmp(he,t.五行.时辰)];
 var good=cmp.filter(function(x){return x==="生我"||x==="我克"||x==="比和"}).length;
 var bad=cmp.filter(function(x){return x==="克我"||x==="我生"}).length;
 var lk=PALACES[r.human].luck;
 var lkBad=(lk==="凶"||lk==="大凶");
 var lkGood=(lk==="大吉"||lk==="吉"||lk==="小吉");
 var tail="";
 if(lkBad){
   tail=(good>=2)?"外部看似有助力，但人宫不吉，最终仍以守为上。":"外部在消耗，人宫又不吉，宜退守、宜改期。";
 } else if(lkGood){
   tail=(bad>=2)?"人宫可用，但外部消耗偏大，宜小步推进。":"人宫与外部相合，可以推进。";
 } else {
   tail=(good>=2)?"条件尚可，稳步推进即可。":"外部略耗，放慢节奏更稳。";
 }
 var advice=PALACES[r.human].luck==="大凶"||PALACES[r.human].luck==="凶"
   ? "本课不利于强求。把动作放慢，先保住已有的。"
   : (PALACES[r.human].luck==="大吉"||PALACES[r.human].luck==="吉"
     ? "本课可用。想做的事可以往前推一步，但别省掉该走的程序。"
     : "本课不急。可以做，但别赶；给它一点时间发酵。");
 return {lines:lines, cmp:"天宫 "+cmp[0]+" · 地宫 "+cmp[1]+" · 时辰 "+cmp[2]+" → "+tail, advice:advice};
}

</script>
<script>

var mode="now";
function $(s){return document.querySelector(s)}
document.querySelectorAll(".tabs button").forEach(function(b){b.addEventListener("click",function(){
  mode=b.dataset.m;
  document.querySelectorAll(".tabs button").forEach(function(x){x.classList.toggle("on",x===b)});
  ["now","num","dir","yao"].forEach(function(m){$("#f-"+m).classList.toggle("hide",m!==mode)});
  var isYao=(mode==="yao");
  ["q","qLabel","go","out"].forEach(function(id){var el=document.getElementById(id); if(el) el.style.display=isYao?"none":"";});
})});
var LUCK_CLASS=function(l){return ["大吉","吉","小吉"].indexOf(l)>=0?"good":(l==="中吉"?"mid":"bad")};
function interpBlock(res){
  var d=interpret(res);
  return "<div class=\"read\">"+
    d.lines.map(function(x){return "<p>"+x+"</p>"}).join("")+
    "<p class=\"cmp\">"+d.cmp+"</p>"+
    "<p class=\"adv\">"+d.advice+"</p></div>";
}
function render(res){
  var t=res.table;
  function row(k){return "<tr><th>"+k+"</th><td>"+t[k].天宫+"</td><td>"+t[k].地宫+"</td><td>"+t[k].人宫+"</td><td>"+t[k].时辰+"</td></tr>"}
  function card(pos,pal,human,rel){
    return "<div class=\"card "+(human?"human":"")+"\"><div class=\"pos\">"+pos+"</div><div class=\"pal\">"+pal+
    "</div><div class=\"el\">"+PALACES[pal].element+"</div><div class=\"rel\">"+rel+"</div></div>";
  }
  $("#out").innerHTML=
   "<div class=\"meta\">"+res.input+"<br>"+res.hour+" · "+HOURS[res.hour].range+"</div>"+
   "<div class=\"cards\">"+card("天宫",res.heaven,false,t.六亲.天宫)+card("地宫",res.earth,false,t.六亲.地宫)+card("人宫",res.human,true,"我")+"</div>"+
   "<div class=\"luck "+LUCK_CLASS(res.luck)+"\"><span style=\"color:#8a8f98;font-size:12px;letter-spacing:.15em\">人事吉凶</span><b>"+res.luck+"</b></div>"+
   "<table><tr><th></th><th>天宫</th><th>地宫</th><th>人宫</th><th>时辰</th></tr>"+
   row("五行")+row("六亲")+row("死六神")+row("活六神")+"</table>"+
   interpBlock(res)+
   "<details><summary>起课过程</summary><div style=\"margin-top:8px;line-height:1.7\">"+res.process+"</div></details>";
}
function saveHistory(item){
  var k="xlr_history",arr=JSON.parse(localStorage.getItem(k)||"[]");
  arr.unshift(item);localStorage.setItem(k,JSON.stringify(arr.slice(0,20)));paintHistory();
}
function paintHistory(){
  var arr=JSON.parse(localStorage.getItem("xlr_history")||"[]");
  $("#hist").innerHTML=arr.length?arr.map(function(h){return "<div class=\"hi\"><span>"+(h.q||"（未写问题）")+"</span><span>"+h.p+" · "+h.luck+"</span></div>"}).join(""):"<div class=\"hi\" style=\"color:#4e535a\">还没有记录</div>";
}
$("#go").addEventListener("click",function(){
  var question=$("#q").value.trim(),cast,input;
  try{
    if(mode==="now"){
      var now=beijingNow(),lu=solarToLunar(now),hn=hourNameFor(now.getHours()),num=HOURS[hn].number;
      cast=castNumbers(lu.month,lu.day,num);cast.hour=hn;
      input="北京时间 "+now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0")+" "+
        String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0")+"；农历 "+lu.year+"年"+(lu.isLeap?"闰":"")+lu.month+"月"+lu.day+"日，"+hn+"（时辰序号 "+num+"）";
    } else if(mode==="num"){
      var a=parseInt($("#n1").value||"0",10),b=parseInt($("#n2").value||"0",10),c=parseInt($("#n3").value||"0",10);
      var hn2=hourNameFor(beijingNow().getHours());
      cast=castNumbers(a,b,c);cast.hour=hn2;
      input="报数 "+a+", "+b+", "+c+"；"+hn2;
    } else {
      var d1=$("#d1").value.trim(),d2=$("#d2").value.trim(),d3=$("#d3").value.trim();
      if(!PALACES[d1]||!PALACES[d2]||!PALACES[d3]){alert("宫位请填：大安 / 留连 / 速喜 / 赤口 / 小吉 / 空亡");return}
      var hn3=hourNameFor(beijingNow().getHours());
      cast={heaven:d1,earth:d2,human:d3,hour:hn3,process:"宫位直选：天宫="+d1+"，地宫="+d2+"，人宫="+d3};
      input="宫位直选；"+hn3;
    }
  }catch(e){alert("起课失败："+e.message);return}
  var res=chart(cast);res.input=input;render(res);
  saveHistory({q:question,p:res.heaven+"·"+res.earth+"·"+res.human,luck:res.luck,t:Date.now()});
});
paintHistory();

</script>
<script>
var TG=[{b:"111",n:"乾",x:"天",i:"刚健"},{b:"110",n:"兑",x:"泽",i:"喜悦"},{b:"101",n:"离",x:"火",i:"附丽"},{b:"100",n:"震",x:"雷",i:"奋动"},{b:"011",n:"巽",x:"风",i:"顺入"},{b:"010",n:"坎",x:"水",i:"险陷"},{b:"001",n:"艮",x:"山",i:"静止"},{b:"000",n:"坤",x:"地",i:"柔顺"}];
var HEX={
"乾":{"乾":"乾为天","兑":"天泽履","离":"天火同人","震":"天雷无妄","巽":"天风姤","坎":"天水讼","艮":"天山遁","坤":"天地否"},
"兑":{"乾":"泽天夬","兑":"兑为泽","离":"泽火革","震":"泽雷随","巽":"泽风大过","坎":"泽水困","艮":"泽山咸","坤":"泽地萃"},
"离":{"乾":"火天大有","兑":"火泽睽","离":"离为火","震":"火雷噬嗑","巽":"火风鼎","坎":"火水未济","艮":"火山旅","坤":"火地晋"},
"震":{"乾":"雷天大壮","兑":"雷泽归妹","离":"雷火丰","震":"震为雷","巽":"雷风恒","坎":"雷水解","艮":"雷山小过","坤":"雷地豫"},
"巽":{"乾":"风天小畜","兑":"风泽中孚","离":"风火家人","震":"风雷益","巽":"巽为风","坎":"风水涣","艮":"风山渐","坤":"风地观"},
"坎":{"乾":"水天需","兑":"水泽节","离":"水火既济","震":"水雷屯","巽":"水风井","坎":"坎为水","艮":"水山蹇","坤":"水地比"},
"艮":{"乾":"山天大畜","兑":"山泽损","离":"山火贲","震":"山雷颐","巽":"山风蛊","坎":"山水蒙","艮":"艮为山","坤":"山地剥"},
"坤":{"乾":"地天泰","兑":"地泽临","离":"地火明夷","震":"地雷复","巽":"地风升","坎":"地水师","艮":"地山谦","坤":"坤为地"}
};
var POS=["初","二","三","四","五","上"];
var POSMEAN=["事之始，宜稳不宜急","内卦之中，看自身处境","内卦之终，转折将起","外卦之始，事入外部","主位，关键在此","事之终，过犹不及"];
var yaoState=[];
function trigramOf(bits){for(var i=0;i<TG.length;i++){if(TG[i].b===bits)return TG[i];}return TG[7];}
function tossOnce(){var b=0;for(var i=0;i<3;i++){if(Math.random()<0.5)b++;}return b===0?6:(b===1?7:(b===2?8:9));}
function yaoDraw(){
  var box=document.getElementById("yao-lines");
  var html="";
  for(var i=0;i<6;i++){
    var v=yaoState[i];
    var known=(typeof v==="number");
    var yang=known?((v===7||v===9)?1:0):0;
    var moving=known?((v===6||v===9)?1:0):0;
    var segs;
    if(!known){segs='<div class="seg" style="background:#222831"></div>';}
    else if(yang){segs='<div class="seg"></div>';}
    else {segs='<div class="seg"></div><div class="gap"></div><div class="seg"></div>';}
    var mk=known?(moving?(v===9?"○":"×"):""):"";
    html+='<div class="yao '+(known?(yang?"yang":"yin"):"")+(moving?" moving":"")+(known?" yao-appear":"")+'">'+
      '<span class="pos">'+POS[i]+'</span><span class="bar">'+segs+'</span><span class="mk">'+mk+'</span></div>';
  }
  box.innerHTML=html;
}
function yaoInfo(){
  var baseBits=[],chBits=[],mv=[];
  for(var i=0;i<6;i++){
    var v=yaoState[i];
    var b=(v===7||v===9)?1:0;
    baseBits.push(b);
    var m=(v===6||v===9);
    if(m)mv.push(i);
    chBits.push(m?1-b:b);
  }
  var low=trigramOf(baseBits.slice(0,3).join(""));
  var up=trigramOf(baseBits.slice(3,6).join(""));
  var name=HEX[up.n][low.n];
  var out="<b>"+name+"</b>　上"+up.x+"（"+up.i+"）· 下"+low.x+"（"+low.i+"）";
  if(mv.length){
    var low2=trigramOf(chBits.slice(0,3).join("")),up2=trigramOf(chBits.slice(3,6).join(""));
    var name2=HEX[up2.n][low2.n];
    out+="<br>动爻："+mv.map(function(i){return POS[i]+"爻（"+POSMEAN[i]+"）";}).join("、");
    out+="<br>变卦：<b>"+name2+"</b>";
    if(mv.length===1) out+="<br>一爻独动，转折就在"+POS[mv[0]]+"爻；本卦是现状，变卦是走向。";
    else if(mv.length<=3) out+="<br>数爻发动，情势在变；本卦看起因，变卦看结果。";
    else if(mv.length<6) out+="<br>动多静少，趋势已偏；以变卦为主判断。";
    else out+="<br>六爻尽动，旧局全翻、新局未成；此事宜缓不宜决。";
  } else {
    out+="<br>六爻安静，无动爻；以本卦卦象为主，事情大体如其所象。";
  }
  document.getElementById("yao-info").innerHTML=out;
}
function yaoLabel(){
  var n=yaoState.length;
  var btn=document.getElementById("yao-btn");
  if(n>=6){btn.textContent="已 成 卦";btn.disabled=true;}
  else {btn.textContent="摇 第 "+["一","二","三","四","五","六"][n]+" 爻";btn.disabled=false;}
}
document.getElementById("yao-btn").addEventListener("click",function(){
  if(yaoState.length>=6)return;
  yaoState.push(tossOnce());
  yaoDraw();yaoLabel();
  if(yaoState.length===6)yaoInfo();
  else document.getElementById("yao-info").textContent="已摇 "+yaoState.length+" 爻，继续";
});
document.getElementById("yao-reset").addEventListener("click",function(){
  yaoState=[];yaoDraw();yaoLabel();
  document.getElementById("yao-info").textContent="点下方按钮，从初爻开始，一爻一爻摇";
});
yaoDraw();yaoLabel();
</script>
</body>
</html>
